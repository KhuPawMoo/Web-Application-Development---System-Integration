<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Catalog</title>
<style>
:root{--bg:#f7f5f0;--surface:#fff;--ink:#1d2a24;--muted:#5d6b64;--line:#dcd8cc;--accent:#1f5c4a;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--surface:#1d2521;--ink:#eaf0ec;--muted:#9baba3;--line:#2f3b35;--accent:#6fcfae;--accent-ink:#0e1a15}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",sans-serif}
header{padding:2.5rem 1.25rem 1rem;max-width:1100px;margin:0 auto}
h1{margin:0 0 .25rem;font:700 2rem/1.1 Georgia,"Times New Roman",serif}
header p{margin:0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:.75rem;max-width:1100px;margin:0 auto;padding:1rem 1.25rem}
input,select,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.55rem .75rem}
input{flex:1 1 220px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:0 1.25rem 3rem}
#status{padding:1rem 0;color:var(--muted)}
#status.error{color:#b3261e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--bg)}
.card div{padding:.85rem 1rem 1rem}
.card h2{font-size:1rem;margin:0 0 .25rem}
.cat{color:var(--muted);font-size:.85rem;text-transform:capitalize}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:.5rem}
.price{font:700 1.15rem Georgia,serif}
.rating{color:var(--muted);font-size:.9rem}
.pager{display:flex;gap:.75rem;align-items:center;justify-content:center;margin-top:2rem}
dialog{max-width:640px;width:calc(100% - 2rem);border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:1.25rem}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog img{width:100%;max-height:300px;object-fit:contain;background:var(--bg);border-radius:6px}
dialog h2{font-family:Georgia,serif;margin:.75rem 0 .25rem}
dialog dl{display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;margin:1rem 0}
dialog dt{color:var(--muted)}dialog dd{margin:0}
</style>
</head>
<body>
<header>
  <h1>Product Catalog</h1>
  <p>Live product data from DummyJSON.</p>
</header>

<form class="tools" id="tools" role="search">
  <input id="q" type="search" placeholder="Search products" aria-label="Search products">
  <select id="cat" aria-label="Category"><option value="">All categories</option></select>
  <select id="sort" aria-label="Sort">
    <option value="">Default order</option>
    <option value="price-asc">Price: low to high</option>
    <option value="price-desc">Price: high to low</option>
    <option value="rating-desc">Top rated</option>
  </select>
  <button class="primary" type="submit">Search</button>
</form>

<main>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
  <div class="pager">
    <button id="prev">Previous</button>
    <span id="page"></span>
    <button id="next">Next</button>
  </div>
</main>

<dialog id="dlg">
  <img id="d-img" alt="">
  <h2 id="d-title"></h2>
  <p id="d-desc"></p>
  <dl id="d-info"></dl>
  <button id="d-close">Close</button>
</dialog>

<script>
const API = "https://dummyjson.com/products";
const PER_PAGE = 12;
let page = 0, total = 0;
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);

function endpoint() {
  const q = $("q").value.trim(), cat = $("cat").value, sort = $("sort").value;
  let url = q ? `${API}/search?q=${encodeURIComponent(q)}` : cat ? `${API}/category/${encodeURIComponent(cat)}` : API;
  const params = new URLSearchParams({limit: PER_PAGE, skip: page * PER_PAGE});
  if (sort) { const [by, order] = sort.split("-"); params.set("sortBy", by); params.set("order", order); }
  return url + (url.includes("?") ? "&" : "?") + params;
}

async function load() {
  const status = $("status");
  status.className = ""; status.textContent = "Loading products...";
  $("grid").innerHTML = "";
  try {
    const res = await fetch(endpoint());
    if (!res.ok) throw new Error("Server returned " + res.status);
    const data = await res.json();
    total = data.total;
    render(data.products);
    status.textContent = total ? `${total} products` : "No products match your search. Try another term or category.";
  } catch (e) {
    status.className = "error";
    status.textContent = "Could not load products (" + e.message + "). Check your connection and try again.";
  }
  const pages = Math.max(1, Math.ceil(total / PER_PAGE));
  $("page").textContent = `Page ${page + 1} of ${pages}`;
  $("prev").disabled = page === 0;
  $("next").disabled = page + 1 >= pages;
}

function render(products) {
  const grid = $("grid");
  products.forEach(p => {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = `<img loading="lazy" alt="" src="${p.thumbnail}"><div>
      <h2></h2><span class="cat"></span>
      <div class="row" style="padding:0"><span class="price">${money(p.price)}</span><span class="rating">★ ${p.rating}</span></div></div>`;
    b.querySelector("h2").textContent = p.title;
    b.querySelector(".cat").textContent = p.category.replace(/-/g, " ");
    b.querySelector("img").alt = p.title;
    b.onclick = () => openDetail(p);
    grid.appendChild(b);
  });
}

function openDetail(p) {
  $("d-img").src = p.images?.[0] || p.thumbnail;
  $("d-img").alt = p.title;
  $("d-title").textContent = p.title;
  $("d-desc").textContent = p.description;
  const rows = [["Price", money(p.price)], ["Brand", p.brand || "—"], ["Category", p.category.replace(/-/g, " ")],
    ["Rating", p.rating + " / 5"], ["Availability", p.availabilityStatus || (p.stock > 0 ? "In stock" : "Out of stock")],
    ["Stock", p.stock]];
  const dl = $("d-info"); dl.innerHTML = "";
  rows.forEach(([k, v]) => {
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k; dd.textContent = v; dl.append(dt, dd);
  });
  $("dlg").showModal();
}

async function loadCategories() {
  try {
    const res = await fetch(API + "/categories");
    (await res.json()).forEach(c => {
      const o = document.createElement("option");
      o.value = c.slug; o.textContent = c.name; $("cat").appendChild(o);
    });
  } catch (e) { /* category filter stays at "All" */ }
}

$("tools").onsubmit = e => { e.preventDefault(); page = 0; load(); };
$("cat").onchange = () => { $("q").value = ""; page = 0; load(); };
$("sort").onchange = () => { page = 0; load(); };
$("prev").onclick = () => { page--; load(); scrollTo(0, 0); };
$("next").onclick = () => { page++; load(); scrollTo(0, 0); };
$("d-close").onclick = () => $("dlg").close();
$("dlg").onclick = e => { if (e.target === $("dlg")) $("dlg").close(); };

loadCategories();
load();
</script>
</body>
</html>
